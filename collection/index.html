<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f0e">
<meta name="description" content="Ta collection de jeux physiques Switch 2 et les meilleurs prix en France.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Collection S2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Collection Switch 2</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <header class="appbar">
    <div>
      <h1 id="title">Catalogue</h1>
      <p id="subtitle"></p>
    </div>
    <button class="icon-btn" id="top-action" aria-label="Actualiser les prix" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" id="tabs" aria-label="Navigation"></nav>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
